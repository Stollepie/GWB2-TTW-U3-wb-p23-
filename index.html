<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Business &amp; Space · Liquid Glass Checkpoint</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202c43;background:#e7ebf6;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 7% 100%,#f6e4d7 0,transparent 45%),radial-gradient(ellipse at 95% 85%,#b7caff 0,transparent 50%),radial-gradient(ellipse at 50% 0%,#d7d3ed 0,transparent 50%),#e8edf6;background-attachment:fixed}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible,[tabindex]:focus-visible{outline:3px solid #225ec9;outline-offset:4px}button:disabled{cursor:default}.wrap{max-width:1000px;margin:auto;padding:36px 24px 26px}.brand{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:0 7px 20px}.eyebrow{font-size:11px;letter-spacing:.18em;font-weight:650;text-transform:uppercase;color:#51607b}.brand h1{font-size:20px;font-weight:550;margin:5px 0 0}.pill{font-size:12px;border:1px solid #ffffffb5;border-radius:30px;padding:10px 14px;background:#ffffff50}.glass{background:linear-gradient(135deg,#ffffffe0,#ffffff61 45%,#edf1ff8c);border:1px solid #ffffffed;box-shadow:inset 0 1px 1px white,inset 0 -1px 2px #ffffffb3,0 22px 55px #273a6a20,0 2px 5px #58608015;backdrop-filter:blur(28px) saturate(125%);-webkit-backdrop-filter:blur(28px) saturate(125%)}.panel{border-radius:36px;padding:28px 36px 24px}.progressline{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#506078}.progress{height:6px;background:#6c7fa51c;border-radius:10px;margin-top:13px;overflow:hidden}.progress span{height:100%;display:block;background:linear-gradient(90deg,#779ded,#4178ed);width:0;transition:width .4s;border-radius:inherit}.promptarea{text-align:center;padding:34px 10px 27px}.direction{font-size:12px;color:#536780;letter-spacing:.04em}.prompt{font-size:clamp(34px,5.3vw,60px);font-weight:550;letter-spacing:-.045em;line-height:1.1;margin:15px 0 10px;overflow-wrap:anywhere}.prompt.definition{font-size:clamp(23px,3vw,32px);letter-spacing:-.025em;line-height:1.3;max-width:740px;margin:15px auto 10px}.hint{font-size:14px;color:#536078;margin:0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{position:relative;text-align:left;padding:18px 20px;min-height:90px;border-radius:22px;border:1px solid white;background:linear-gradient(145deg,#ffffffd9,#ffffff50);box-shadow:inset 0 1px 2px white,0 5px 12px #52659212;line-height:1.45;font-size:16px;transition:transform .18s,background .18s}.answer:hover:enabled{background:#ffffffdd;transform:translateY(-1px)}.answer:active:enabled{transform:scale(.985)}.answer.bad{background:#ffe3e7;border-color:#c54760;color:#7b1b32}.answer.good{background:#d6f3e4;border-color:#258858;color:#125735}.tag{display:block;font-weight:650;font-size:12px;margin-top:8px}.feedback{font-size:14px;line-height:1.5;min-height:58px;padding:17px 2px 8px;color:#44546e}.feedback strong{color:#195b43}.actions{display:flex;align-items:center;gap:14px;justify-content:space-between;border-top:1px solid #8e9ab126;padding-top:16px}.score{font-size:12px;line-height:1.7;color:#506078}.controls{display:flex;gap:10px;align-items:center}.reset{background:none;border:0;font-size:13px;min-height:44px;padding:8px}.next{border:1px solid #ffffffef;border-radius:30px;background:linear-gradient(#ffffffba,#ffffff40);box-shadow:inset 0 1px 2px white,0 4px 12px #32467b16;min-height:46px;padding:10px 26px;font-weight:550}.next:disabled{opacity:.4}.next:enabled{background:linear-gradient(#6a9ef5,#477ce1);color:white;border-color:#9cbcff;box-shadow:inset 0 1px 1px #ffffffa0,0 4px 12px #4c77c938}.foot{text-align:center;color:#5b6781;font-size:11px;margin:14px}.results h2{font-size:36px;font-weight:550;margin:20px 0}.results p{color:#52617d;line-height:1.6}.review{display:grid;gap:8px;margin:20px 0}.review details{background:#ffffff90;padding:13px 16px;border-radius:15px;line-height:1.5}.review summary{cursor:pointer;font-weight:550}.review small{color:#5e6b82} [hidden]{display:none!important}@supports not (backdrop-filter:blur(1px)){.glass{background:#edf1fa}.answer{background:#f7f9fd}}@media(max-width:600px){.wrap{padding:20px 13px}.brand{margin:0 8px 16px}.brand h1{font-size:17px}.pill{font-size:10px;padding:8px 10px}.panel{border-radius:29px;padding:22px 18px 18px}.promptarea{padding:28px 0 22px}.answers{grid-template-columns:1fr;gap:9px}.answer{min-height:66px;padding:14px 17px;border-radius:18px;font-size:15px}.prompt{font-size:40px}.actions{gap:8px;flex-wrap:wrap}.controls{gap:4px;margin-left:auto}.next{padding:10px 20px}.score{font-size:11px}.feedback{min-height:54px}.foot{line-height:1.6}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body><main class="wrap"><header class="brand"><div><div class="eyebrow">Liquid Glass Checkpoint</div><h1>Business &amp; Space</h1></div><span class="pill">11 terms · two directions</span></header><section class="panel glass" aria-label="Vocabulary practice"><div class="progressline"><span id="phase">Vocabulary</span><span id="learned"></span></div><div class="progress" role="progressbar" aria-label="Words mastered" aria-valuemin="0" aria-valuemax="11" aria-valuenow="0"><span id="bar"></span></div><div id="exercise"><div class="promptarea"><div class="direction" id="direction"></div><h2 class="prompt" id="prompt"></h2><p class="hint" id="hint"></p></div><div class="answers" id="answers"></div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><div class="actions"><div class="score" id="score"></div><div class="controls"><button class="reset" id="reset">Start over</button><button class="next" id="next" disabled>Continue →</button></div></div></div><div class="results" id="results" hidden></div></section><p class="foot">Take your time. Choose, check, then continue.</p></main><script>
'use strict';
const words=[
  [
    "a handful of people",
    "a very small number of people",
    "Only a handful of people attended the launch.",
    "people"
  ],
  [
    "doable",
    "able to be done",
    "The deadline is tight, but the project is doable.",
    "quality"
  ],
  [
    "to escalate",
    "to become greater or more serious very quickly",
    "The disagreement escalated into a public dispute.",
    "action"
  ],
  [
    "an obstacle",
    "a difficulty or problem that stops you from achieving something",
    "Lack of funding was the biggest obstacle.",
    "concept"
  ],
  [
    "CEO",
    "chief executive officer: the person with the most important position in a company",
    "The CEO announced a new strategy for the company.",
    "people"
  ],
  [
    "to benefit",
    "to be helped by something or to help someone",
    "Small businesses could benefit from lower costs.",
    "action"
  ],
  [
    "a perspective",
    "a point of view",
    "The interview gave me a new perspective on the issue.",
    "concept"
  ],
  [
    "a spacecraft",
    "a vehicle designed for space flight",
    "The spacecraft sent images back to Earth.",
    "concept"
  ],
  [
    "an entrepreneur",
    "a person who starts and runs their own business",
    "The entrepreneur started a business that makes satellite parts.",
    "people"
  ],
  [
    "a breakthrough",
    "a sudden, important discovery or achievement that moves things forward significantly",
    "The team made a breakthrough in engine design.",
    "concept"
  ],
  [
    "hypersonic",
    "moving at least five times the speed of sound",
    "The team tested a hypersonic aircraft.",
    "quality"
  ]
].map(([term,meaning,example,group],id)=>({id,term,meaning,example,group}));
const $=id=>document.getElementById(id);const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let queue,current,mastery,missed,seen,firstOK,attempts,correct,clean,locked,options;
function start(){$('phase').textContent='Vocabulary';mastery=words.map(()=>[false,false]);missed=new Set();seen=new Set();firstOK=0;attempts=0;correct=0;queue=shuffle(words.map(w=>({id:w.id,dir:0})));$('results').hidden=true;$('exercise').hidden=false;show()}
function enqueue(id,dir){if(!queue.some(q=>q.id===id&&q.dir===dir))queue.push({id,dir})}
function stats(){const n=mastery.filter(m=>m.every(Boolean)).length;$('learned').textContent=n+' / '+words.length+' mastered';$('bar').style.width=n/words.length*100+'%';document.querySelector('[role=progressbar]').setAttribute('aria-valuenow',n);$('score').textContent='Correct: '+correct+' / '+attempts+' · Accuracy: '+(attempts?Math.round(correct/attempts*100):0)+'%';return n}
function show(){if(!queue.length){finish();return}current=queue.shift();clean=true;locked=false;const w=words[current.id];$('prompt').textContent=current.dir?w.meaning:w.term;$('prompt').className='prompt'+(current.dir?' definition':'');$('direction').textContent=current.dir?'MEANING → WORD':'WORD → MEANING';$('hint').textContent=current.dir?'Choose the matching word or phrase':'Choose the matching meaning';$('feedback').textContent='';$('next').disabled=true;$('answers').replaceChildren();let pool=words.filter(v=>v.id!==w.id&&!(v.group===w.group&&['enter','leave'].includes(w.group)));pool=shuffle(pool);pool.sort((a,b)=>(b.group===w.group)-(a.group===w.group));options=shuffle([w,...pool.slice(0,3)]);options.forEach(v=>{let b=document.createElement('button');b.className='answer';b.textContent=current.dir?v.term:v.meaning;b.dataset.id=v.id;b.onclick=()=>choose(v.id,b);$('answers').append(b)});stats()}
function choose(id,b){if(locked||b.disabled)return;attempts++;let isFirst=!seen.has(current.id);seen.add(current.id);if(id!==current.id){clean=false;missed.add(current.id);mastery[current.id]=[false,false];b.disabled=true;b.classList.add('bad');let t=document.createElement('span');t.className='tag';t.textContent='Not quite · try again';b.append(t);$('feedback').textContent='Try another option.';stats();return}correct++;if(isFirst)firstOK++;locked=true;b.classList.add('good');let t=document.createElement('span');t.className='tag';t.textContent='✓ Correct';b.append(t);document.querySelectorAll('.answer').forEach(x=>x.disabled=true);if(clean)mastery[current.id][current.dir]=true;else enqueue(current.id,current.dir);if(!mastery[current.id][1-current.dir])enqueue(current.id,1-current.dir);const w=words[current.id];$('feedback').replaceChildren();let strong=document.createElement('strong');strong.textContent=w.term+' — '+w.meaning;$('feedback').append(strong,document.createElement('br'),document.createTextNode(w.example));$('next').disabled=false;stats()}
function finish(){stats();$('exercise').hidden=true;$('results').hidden=false;$('results').replaceChildren();let h=document.createElement('h2');h.textContent='Checkpoint complete.';let p=document.createElement('p');p.textContent='All '+words.length+' words mastered in both directions. Accuracy: '+Math.round(correct/attempts*100)+'% ('+correct+' / '+attempts+'). First-encounter success: '+firstOK+' / '+words.length+'.';let note=document.createElement('p');note.textContent=missed.size?missed.size+' words needed another try. Open a word below to review.':'Every word was correct on its first encounter. Open a word below to review.';let list=document.createElement('div');list.className='review';[...words].sort((a,b)=>Number(missed.has(b.id))-Number(missed.has(a.id))).forEach(w=>{let d=document.createElement('details'),s=document.createElement('summary'),p=document.createElement('p'),e=document.createElement('small');s.textContent=w.term+(missed.has(w.id)?' · reviewed':'');p.textContent=w.meaning;e.textContent=w.example;d.append(s,p,e);list.append(d)});let b=document.createElement('button');b.className='next';b.textContent='Practice again';b.onclick=start;$('results').append(h,p,note,b,list);$('phase').textContent='Complete';window.scrollTo({top:0,behavior:'smooth'})}
$('reset').onclick=()=>{$('phase').textContent='Vocabulary';start()};$('next').onclick=()=>{if(!locked)return;show();$('prompt').tabIndex=-1;$('prompt').focus({preventScroll:true})};start();
</script></body></html>
